\u003c/h1>\u003cp class=\"lead\">Comece pelo código, pela quantidade e pela aplicação. Prepare a mensagem aqui e envie pelo seu e-mail.\u003c/p>\u003c/div>\u003cdiv class=\"contact-grid section compact\">\u003cdiv class=\"contact-details\">\u003ch2>Fale com a Digiquality.\u003c/h2>\u003ca class=\"big-email\" href=\"mailto:vendas@digiquality.com.br\">vendas@digiquality.com.br\u003c/a>\u003cdl>\u003cdt>Telefones publicados\u003c/dt>\u003cdd>\u003ca href=\"tel:+551142271482\">(11) 4227-1482\u003c/a>\u003cbr>\u003ca href=\"tel:+551126138823\">(11) 2613-8823\u003c/a>\u003cbr>\u003ca href=\"tel:+551126138824\">(11) 2613-8824\u003c/a>\u003c/dd>\u003cdt>O que enviar\u003c/dt>\u003cdd>Código e fabricante, quantidade, aplicação e prazo desejado. Para equivalências, inclua as especificações conhecidas.\u003c/dd>\u003c/dl>\u003cp class=\"notice\">Contatos publicados no site original, consultado em 11/10/2026. Operação atual e dados de atendimento ainda sujeitos a confirmação nesta prévia.\u003c/p>\u003cp class=\"catalog-note\">Não há compra, pagamento ou confirmação automática de disponibilidade nesta página.\u003c/p>\u003c/div>\u003cdiv class=\"form-wrap\">\u003ch2>Prepare sua cotação.\u003c/h2>\u003cp>Campos com * são obrigatórios. O formulário monta uma mensagem para você revisar e enviar.\u003c/p>\u003cform id=\"quote-form\">\u003cdiv class=\"form-grid\">\u003cdiv class=\"field full\">\u003clabel for=\"part\">Componente ou part number *\u003c/label>\u003cinput id=\"part\" name=\"part\" required maxlength=\"180\" placeholder=\"Código completo ou descrição do componente\">\u003c/div>\u003cdiv class=\"field\">\u003clabel for=\"quantity\">Quantidade *\u003c/label>\u003cinput id=\"quantity\" name=\"quantity\" required maxlength=\"60\" placeholder=\"Ex.: 500 unidades\">\u003c/div>\u003cdiv class=\"field\">\u003clabel for=\"category\">Família\u003c/label>\u003cselect id=\"category\" name=\"category\">\u003coption value=\"\">Ainda não sei\u003c/option>\u003coption value=\"Fusíveis\">Fusíveis\u003c/option>\u003coption value=\"Porta-fusíveis e clips\">Porta-fusíveis e clips\u003c/option>\u003coption value=\"PTC resetáveis\">PTC resetáveis\u003c/option>\u003coption value=\"TVS, MOV e ESD\">TVS, MOV e ESD\u003c/option>\u003coption value=\"SCR, TRIAC e SIDACtor\">SCR, TRIAC e SIDACtor\u003c/option>\u003coption value=\"NTC e sensores\">NTC e sensores\u003c/option>\u003c/select>\u003c/div>\u003cdiv class=\"field full\">\u003clabel for=\"application\">Aplicação e especificações\u003c/label>\u003ctextarea id=\"application\" name=\"application\" maxlength=\"1800\" placeholder=\"Aplicação, tensão, corrente, dimensões e outros dados conhecidos\">\u003c/textarea>\u003c/div>\u003cdiv class=\"field full\">\u003clabel for=\"deadline\">Prazo desejado\u003c/label>\u003cinput id=\"deadline\" name=\"deadline\" maxlength=\"120\" placeholder=\"Quando você precisa do componente?\">\u003c/div>\u003cdiv class=\"field\">\u003clabel for=\"name\">Seu nome *\u003c/label>\u003cinput id=\"name\" name=\"name\" autocomplete=\"name\" required maxlength=\"100\">\u003c/div>\u003cdiv class=\"field\">\u003clabel for=\"company\">Empresa\u003c/label>\u003cinput id=\"company\" name=\"company\" autocomplete=\"organization\" maxlength=\"150\">\u003c/div>\u003cdiv class=\"field full\">\u003clabel for=\"email\">E-mail para retorno *\u003c/label>\u003cinput id=\"email\" name=\"email\" type=\"email\" autocomplete=\"email\" required maxlength=\"150\">\u003c/div>\u003c/div>\u003cdiv class=\"form-actions\">\u003cbutton id=\"prepare-quote\" class=\"button arrow\" type=\"submit\" disabled>Preparar mensagem\u003c/button>\u003c/div>\u003cp class=\"form-note\">Os campos são processados apenas neste navegador. Esta página não armazena nem envia o formulário a um servidor. Ao usar seu aplicativo de e-mail, os dados serão enviados conforme o serviço que você utiliza. Não inclua senhas ou dados sensíveis.\u003c/p>\u003c/form>\u003cdiv id=\"quote-output\" class=\"output\" hidden>\u003clabel for=\"quote-message\">Mensagem para revisar e copiar\u003c/label>\u003ctextarea id=\"quote-message\" readonly>\u003c/textarea>\u003cp id=\"copy-status\" class=\"output-status\" role=\"status\" aria-live=\"polite\">\u003c/p>\u003cdiv class=\"form-actions\">\u003ca id=\"open-email\" class=\"button arrow\" href=\"mailto:vendas@digiquality.com.br\">Abrir meu e-mail\u003c/a>\u003cbutton id=\"copy-message\" class=\"button secondary\" type=\"button\">Copiar mensagem\u003c/button>\u003c/div>\u003cp class=\"form-note\">Se não houver um aplicativo de e-mail configurado, copie a mensagem e envie manualmente para vendas@digiquality.com.br.\u003c/p>\u003c/div>\u003cnoscript>\u003cp class=\"notice\">Para montar a mensagem, ative JavaScript. Você também pode enviar código, quantidade e aplicação diretamente para vendas@digiquality.com.br.\u003c/p>\u003c/noscript>\u003c/div>\u003c/div>\u003c/div>\u003c/main>\u003cfooter class=\"footer\">\u003cdiv class=\"wrap\">\u003cdiv class=\"footer-main\">\u003cdiv>\u003ca class=\"brand\" href=\"#/\" aria-label=\"Digiquality, página inicial\">\u003cimg src=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA1OTkuMzUwIDE1MCIgc3R5bGU9ImNvbG9yOiMwMDgwMDAiIHJvbGU9ImltZyI+PHRpdGxlPkRpZ2lxdWFsaXR5IHByb3Bvc3RhIEEgLSBoaXDDs3Rlc2UgTlBOPC90aXRsZT48ZGVzYz5Fc3R1ZG8gcmV2aXPDoXZlbC4gTWFucm9wZSBNZWRpdW0gNTAwIGVtIGN1cnZhcyBlIGNvbXBvbmVudGVzIGNvbnN0cnXDrWRvcyBnZW9tZXRyaWNhbWVudGUuIEEgc2V0YSBkZXZlIHNlciB2YWxpZGFkYSBhbnRlcyBkYSBtYXJjYSBmaW5hbC48L2Rlc2M+PGcgZmlsbD0iY3VycmVudENvbG9yIiBzdHJva2UtbGluZWNhcD0iYnV0dCIgc3Ryb2tlLWxpbmVqb2luPSJyb3VuZCI+PHBhdGggdHJhbnNmb3JtPSJ0cmFuc2xhdGUoMjkuMDAwIDEwMC4wMDApIHNjYWxlKDAuMDUwMDAwIC0wLjA1MDAwMCkiIGQ9Ik0xNDAgMFYxNDQwSDU4NFE2MDYgMTQ0MCA2NjEuMCAxNDM5LjBRNzE2IDE0MzggNzY2IDE0MzFROTMzIDE0MDkgMTA0NS41IDEzMDkuNVExMTU4IDEyMTAgMTIxNS4wIDEwNTcuMFExMjcyIDkwNCAxMjcyIDcyMFExMjcyIDUzNiAxMjE1LjAgMzgzLjBRMTE1OCAyMzAgMTA0NS41IDEzMC41UTkzMyAzMSA3NjYgOVE3MTYgMyA2NjAuNSAxLjVRNjA1IDAgNTg0IDBaTTMyMyAxNzBINTg0UTY para cotação\u003c/h1>\u003cp class=\"lead\">Corrente nominal é só o começo. Reúna os dados que ajudam a identificar a família correta e a comparar uma possível substituição.\u003c/p>\u003cp class=\"reading-meta\">Revisão editorial: 11 de outubro de 2026 · Leitura de 4 min\u003c/p>\u003c/div>\u003cdiv class=\"content-grid section compact\">\u003carticle>\u003csection>\u003ch2>Comece pelo código original\u003c/h2>\u003cp>Se o equipamento já usa um fusível, registre o part number completo, o fabricante e as marcações. Informe as dimensões e a montagem. Letras e sufixos podem identificar características importantes da série.\u003c/p>\u003c/section>\u003csection>\u003ch2>Descreva as condições elétricas\u003c/h2>\u003cp>Informe corrente normal, tensão AC ou DC, corrente de partida e duração do evento. Quando conhecido, inclua o curto-circuito disponível e os requisitos de interrupção. Não presuma que dois componentes da mesma corrente nominal sejam equivalentes.\u003c/p>\u003c/section>\u003csection>\u003ch2>Considere atuação e temperatura\u003c/h2>\u003cp>Compare a curva tempo-corrente, o I²t e as condições térmicas. Temperatura próxima ao componente, dissipação e montagem influenciam a aplicação. Rápido ou retardado é uma característica que deve ser analisada com a curva da série.\u003c/p>\u003c/section>\u003csection>\u003ch2>Monte uma solicitação objetiva\u003c/h2>\u003cp>Envie código, quantidade, aplicação, corrente, tensão, dimensões, atuação esperada e prazo desejado. Se algum dado não estiver disponível, diga o que é conhecido e identifique a informação que ainda falta.\u003c/p>\u003c/section>\u003csection>\u003ch2>Valide antes de substituir\u003c/h2>\u003cp>A seleção final exige o datasheet vigente e validação no circuito. Este roteiro organiza a consulta; não é uma aprovação técnica de substituição.\u003c/p>\u003c/section>\u003csection>\u003ch2>Fontes e leitura complementar\u003c/h2>\u003cul class=\"source-list\">\u003cli>\u003ca href=\"https://www.littelfuse.com/assetdocs/fuseology-selection-guide?assetguid=d812dff2-1c47-4dc3-bce7-07a4001ddc32\" target=\"_blank\" rel=\"noopener noreferrer\">Fuseology Design Guide · Littelfuse ↗\u003c/a>\u003csmall>PDF técnico · edição ©2022 · consultado em 11/10/2026\u003c/small>\u003c/li>\u003c/ul>\u003cp class=\"notice\">Conteúdo informativo. A seleção do componente e qualquer substituição devem ser validadas por profissional responsável pelo projeto ou equipamento.\u003c/p>\u003c/section>\u003ca class=\"text-link\" href=\"#/produtos/fusiveis/\">Explorar Fusíveis\u003c/a>\u003c/article>\u003caside class=\"sidebar\">\u003cspan class=\"eyebrow\">Próximo passo\u003c/span>\u003ch2>Vamos ao componente certo.\u003c/h2>\u003cp>Conte o que você precisa. Código, quantidade e aplicação ajudam a preparar a consulta.\u003c/p>\u003ca class=\"button arrow\" href=\"#/contato/?categoria=Fus%C3%ADveis\">Solicitar cotação\u003c/a>\u003chr>\u003ch3>Para ter em mãos\u003c/h3>\u003cul>\u003cli>01 · Código e fabricante\u003c/li>\u003cli>02 · Quantidade necessária\u003c/li>\u003cli>03 · Aplicação e especificações\u003c/li>\u003cli>04 · Prazo desejado\u003c/li>\u003c/ul>\u003cp class=\"no-margin\">Disponibilidade, compatibilidade e condições comerciais precisam de confirmação.\u003c/p>\u003c/aside>\u003c/div>\u003c/div>\u003c/main>\u003cfooter class=\"footer\">\u003cdiv class=\"wrap\">\u003cdiv class=\"footer-main\">\u003cdiv>\u003ca class=\"brand\" href=\"#/\" aria-label=\"Digiquality, página inicial\">\u003cimg src=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA1OTkuMzUwIDE1MCIgc3R5bGU9ImNvbG9yOiMwMDgwMDAiIHJvbGU9ImltZyI+PHRpdGxlPkRpZ2lxdWFsaXR5IHByb3Bvc3RhIEEgLSBoaXDDs3Rlc2UgTlBOPC90aXRsZT48ZGVzYz5Fc3R1ZG8gcmV2aXPDoXZlbC4gTWFucm9wZSBNZWRpdW0gNTAwIGVtIGN1cnZhcyBlIGNvbXBvbmVudGVzIGNvbnN0cnXDrWRvcyBnZW9tZXRyaWNhbWVudGUuIEEgc2V0YSBkZXZlIHNlciB2YWxpZGFkYSBhbnRlcyBkYSBtYXJjYSBmaW5hbC48L2Rlc2M+PGcgZmlsbD0iY3VycmVudENvbG9yIiBzdHJva2UtbGluZWNhcD0iYnV0dCIgc3Ryb2tlLWx a-label=\"Navegação principal\">\u003ca href=\"#/catalogo/\">Componentes\u003c/a>\u003ca href=\"#/recursos/\" aria-current=\"page\">Recursos técnicos\u003c/a>\u003ca href=\"#/empresa/\">A Digiquality\u003c/a>\u003ca class=\"quote-link\" href=\"#/contato/\">Solicitar cotação ↗\u003c/a>\u003c/nav>\u003c/div>\u003c/header>\u003cmain id=\"conteudo\">\u003cdiv class=\"wrap\">\u003cnav class=\"breadcrumb\" aria-label=\"Você está em\">\u003ca href=\"#/\">Início\u003c/a>\u003cspan aria-hidden=\"true\">/\u003c/span>\u003ca href=\"#/recursos/\">Recursos técnicos\u003c/a>\u003cspan aria-hidden=\"true\">/\u003c/span>\u003cspan aria-current=\"page\">NTC para temperatura ou corrente de partida?\u003c/span>\u003c/nav>\u003cdiv class=\"page-hero article-title\">\u003cdiv class=\"eyebrow\">Guia · Temperatura\u003c/div>\u003ch1>NTC para temperatura ou corrente de partida?\u003c/h1>\u003cp class=\"lead\">A sigla é a mesma, mas a função muda os critérios. Descubra quais informações reunir para cada aplicação.\u003c/p>\u003cp class=\"reading-meta\">Revisão editorial: 11 de outubro de 2026 · Leitura de 3 min\u003c/p>\u003c/div>\u003cdiv class=\"content-grid section compact\">\u003carticle>\u003csection>\u003ch2>O que caracteriza um NTC\u003c/h2>\u003cp>A resistência diminui quando a temperatura aumenta. Essa relação pode ser usada na medição térmica; em componentes projetados para isso, o comportamento também é aproveitado na limitação da corrente de partida.\u003c/p>\u003c/section>\u003csection>\u003ch2>Para medir temperatura\u003c/h2>\u003cp>Compare resistência de referência, tolerância, beta ou curva R-T, faixa térmica, resposta e montagem. A resistência em um único ponto não descreve toda a curva do sensor.\u003c/p>\u003c/section>\u003csection>\u003ch2>Para limitar corrente de partida\u003c/h2>\u003cp>Considere resistência a frio, corrente contínua permitida, energia do evento e condições de resfriamento. O funcionamento depende da temperatura do componente; uma religação deve ser avaliada nas condições reais da aplicação.\u003c/p>\u003c/section>\u003csection>\u003ch2>Evite equivalências por aparência\u003c/h2>\u003cp>Não selecione um substituto apenas pela resistência ou pelo diâmetro. Envie código, aplicação, quantidade e condições elétricas/térmicas. Confirme todos os parâmetros no datasheet vigente antes de usar o componente.\u003c/p>\u003c/section>\u003csection>\u003ch2>Fontes e leitura complementar\u003c/h2>\u003cul class=\"source-list\">\u003cli>\u003ca href=\"https://www.littelfuse.com/design-center/training-and-education/temperature-sensor-knowledge-center/thermistor-info/thermistor-technology\" target=\"_blank\" rel=\"noopener noreferrer\">Thermistor Technology · Littelfuse ↗\u003c/a>\u003csmall>Referência conceitual oficial · consultado em 11/10/2026\u003c/small>\u003c/li>\u003cli>\u003ca href=\"https://www.tdk-electronics.tdk.com/download/2982800/f5be4fca9d1f66204de9cf37891e5265/ntc-thermistors-icl-an.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">NTC Inrush Current Limiters · TDK ↗\u003c/a>\u003csmall>Nota de aplicação · edição 2013 · referência conceitual · consultado em 11/10/2026\u003c/small>\u003c/li>\u003c/ul>\u003cp class=\"notice\">Conteúdo informativo. A seleção do componente e qualquer substituição devem ser validadas por profissional responsável pelo projeto ou equipamento.\u003c/p>\u003c/section>\u003ca class=\"text-link\" href=\"#/produtos/ntc-sensores/\">Explorar NTC e sensores\u003c/a>\u003c/article>\u003caside class=\"sidebar\">\u003cspan class=\"eyebrow\">Próximo passo\u003c/span>\u003ch2>Vamos ao componente certo.\u003c/h2>\u003cp>Conte o que você precisa. Código, quantidade e aplicação ajudam a preparar a consulta.\u003c/p>\u003ca class=\"button arrow\" href=\"#/contato/?categoria=NTC%20e%20sensores\">Solicitar cotação\u003c/a>\u003chr>\u003ch3>Para ter em mãos\u003c/h3>\u003cul>\u003cli>01 · Código e fabricante\u003c/li>\u003cli>02 · Quantidade necessária\u003c/li>\u003cli>03 · Aplicação e especificações\u003c/li>\u003cli>04 · Prazo desejado\u003c/li>\u003c/ul>\u003cp class=\"no-margin\">Disponibilidade, compatibilidade e condições comerciais precisam de confirmação.\u003c/p>\u003c/aside>\u003c/div>\u003c/div>\u003c/main>\u003cfooter class=\"footer\">\u003cdiv class=\"wrap\">\u003cdiv class=\"footer-main\">\u003cdiv>\u003ca class=\"brand\" href=\"#/\" aria-label=\"Digiquality, página inicial\">\u003cimg src=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA1OTkuMzUwIDE1MCIgc3R5bGU9ImNvbG9yOiMwMDgwMDAiIHJvbGU9ImltZyI+PHRpdGxlPkRpZ2lxdWFsaXR5IHByb3Bvc3RhIEEgLSBoaXDDs3Rlc2UgTlBOPC90aXRsZT48ZGVzYz5Fc3R1ZG8gcmV2aXPDoXZlbC4gTWFucm9wZSBNZWRpdW0gNTAwIGVtIGN1cnZhcyBlIGNvbXBvbmVudGVzIGNvbnN0cnXDrWRvcyBnZW9tZXRyaWNhbWVudGUuIEEgc2V0YSBkZXZlIHNlciB2YWxpZGFkYSBhbnRlcyBkYSBtYXJjYSBmaW5hbC48L2Rlc2M+PGcgZmlsbD0iY3VycmVudENvbG9yIiBzdHJva2UtbGluZWNhcD0iYnV0dCIgc3Ryb2tlLWxpbmVqb2luPSJyb3VuZCI+PHBhdGggdHJhbnNmb3JtPSJ0cmFuc2xhdGUoMjkuMDAwIDEwMC4wMDApIHNjYWxlKDAuMDUwMDAwIC0wLjA1MDAwMCkiIGQ9Ik0xNDAgMFYxNDQwSDU4NFE2MDYgMTQ0MCA2NjEuMCAxNDM5LjBRNzE2IDE0MzggNzY2IDE0MzFROTMzIDE0MDkgMTA0NS41IDEzMDkuNVExMTU4IDEyMTAgMTIxNS4wIDEwNTcuMFExMjcyIDkwNCAxMjcyIDcyMFExMjcyIDUzNiAxMjE1LjAgMzgzLjBRMTE1OCAyMzAgMTA0NS41IDEzMC41UTkzMyAzMSA3NjYgOVE3MTYgMyA2NjAuNSAxLjVRNjA1IDAgNTg0IDBaTTMyMyAxNzBINTg0UTYyMiAxNzAgNjY5LjAgMTcyLjVRNzE2IDE3NSA3NTEgMTgxUTg2OSAyMDMgOTQyLjAgMjgwLjBRMTAxNSAzNTcgMTA0OS4wIDQ3Mi4wUTEwODMgNTg3IDEwODMgNzIwUTEwODMgODU2IDEwNDguNSA5NzEuMFExMDE0IDEwODYgOTQxLjAgMTE2Mi4wUTg2OCAxMjM4IDc1MSAxMjU5UTcxNiAxMjY2IDY2OC4wIDEyNjguMFE2MjAgMTI3MCA1ODQgMTI3MEgzMjNaIi8+PHBhdGggZD0iTTEyLjAwMCA0Ny4wMDAgTDM5LjAwMCA0Ny4wMDAiIGZpbGw9Im5vbmUiIHN0cm9rZT0iY3VycmVudENvbG9yIiBzdHJva2Utd2lkdGg9IjQuNSIvPjxwYXRoIGQ9Ik0xMi4wMDAgODEuMDAwIEwzOS4wMDAgODEuMDAwIiBmaWxsPSJub25lIiBzdHJva2U9ImN1cnJlbnRDb2xvciIgc3Ryb2tlLXdpZHRoPSI0LjUiLz48Y2lyY2xlIGN4PSIxMDAuMSIgY3k9IjY0IiByPSI2LjIiIGZpbGw9Im5vbmUiIHN0cm9rZT0iY3VycmVudENvbG9yIiBzdHJva2Utd2lkdGg9IjMuNSIvPjxwYXRoIGQ9Ik0xMDcuMDAwIDY0LjAwMCBM s=\"content-grid section compact\">\u003carticle>\u003csection>\u003ch2>Defina o evento e o ponto protegido\u003c/h2>\u003cp>Qual transiente pode chegar ao circuito? Onde a proteção será instalada? A tensão de operação e o limite suportado pelo componente protegido orientam a análise. Um barramento de alimentação e uma interface de dados têm necessidades diferentes.\u003c/p>\u003c/section>\u003csection>\u003ch2>Compare nas mesmas condições\u003c/h2>\u003cp>Verifique tensão de trabalho, tensão de limitação, corrente ou energia suportada e forma de onda usada no ensaio. Valores de pico medidos com formas de onda distintas não devem ser comparados como se fossem equivalentes.\u003c/p>\u003c/section>\u003csection>\u003ch2>Observe o impacto no sinal\u003c/h2>\u003cp>Em interfaces rápidas, capacitância e leiaute podem afetar a integridade do sinal. Considere a polaridade e o caminho da corrente de descarga, além das especificações do dispositivo de proteção.\u003c/p>\u003c/section>\u003csection>\u003ch2>Leve o contexto à cotação\u003c/h2>\u003cp>Informe o código desejado ou descreva tensão de operação, circuito, tipo de transiente, interface, montagem e quantidade. A compatibilidade deve ser validada com documentação vigente e ensaios adequados.\u003c/p>\u003c/section>\u003csection>\u003ch2>Fontes e leitura complementar\u003c/h2>\u003cul class=\"source-list\">\u003cli>\u003ca href=\"https://www.littelfuse.com/products/overvoltage-protection/tvs-diodes\" target=\"_blank\" rel=\"noopener noreferrer\">Diodos TVS · Littelfuse ↗\u003c/a>\u003csmall>Página técnica oficial · consultado em 11/10/2026\u003c/small>\u003c/li>\u003cli>\u003ca href=\"https://www.littelfuse.com/products/overvoltage-protection/varistors\" target=\"_blank\" rel=\"noopener noreferrer\">Varistores · Littelfuse ↗\u003c/a>\u003csmall>Página técnica oficial · consultado em 11/10/2026\u003c/small>\u003c/li>\u003cli>\u003ca href=\"https://www.littelfuse.com/products/overvoltage-protection/tvs-diode-arrays/connectivity-tvs-diode-arrays/sp4208\" target=\"_blank\" rel=\"noopener noreferrer\">ESD de baixa capacitância · SP4208 ↗\u003c/a>\u003csmall>Exemplo de parâmetros técnicos, sem indicação de oferta · consultado em 11/10/2026\u003c/small>\u003c/li>\u003c/ul>\u003cp class=\"notice\">Conteúdo informativo. A seleção do componente e qualquer substituição devem ser validadas por profissional responsável pelo projeto ou equipamento.\u003c/p>\u003c/section>\u003ca class=\"text-link\" href=\"#/produtos/protecao-tvs-mov-esd/\">Explorar TVS, MOV e ESD\u003c/a>\u003c/article>\u003caside class=\"sidebar\">\u003cspan class=\"eyebrow\">Próximo passo\u003c/span>\u003ch2>Vamos ao componente certo.\u003c/h2>\u003cp>Conte o que você precisa. Código, quantidade e aplicação ajudam a preparar a consulta.\u003c/p>\u003ca class=\"button arrow\" href=\"#/contato/?categoria=TVS%2C%20MOV%20e%20ESD\">Solicitar cotação\u003c/a>\u003chr>\u003ch3>Para ter em mãos\u003c/h3>\u003cul>\u003cli>01 · Código e fabricante\u003c/li>\u003cli>02 · Quantidade necessária\u003c/li>\u003cli>03 · Aplicação e especificações\u003c/li>\u003cli>04 · Prazo desejado\u003c/li>\u003c/ul>\u003cp class=\"no-margin\">Disponibilidade, compatibilidade e condições comerciais precisam de confirmação.\u003c/p>\u003c/aside>\u003c/div>\u003c/div>\u003c/main>\u003cfooter class=\"footer\">\u003cdiv class=\"wrap\">\u003cdiv class=\"footer-main\">\u003cdiv>\u003ca class=\"brand\" href=\"#/\" aria-label=\"Digiquality, página inicial\">\u003cimg src=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA1OTkuMzUwIDE1MCIgc3R5bGU9ImNvbG9yOiMwMDgwMDAiIHJvbGU9ImltZyI+PHRpdGxlPkRpZ2lxdWFsaXR5IHByb3Bvc3RhIEEgLSBoaXDDs3Rlc2UgTlBOPC90aXRsZT48ZGVzYz5Fc3R1ZG8gcmV2aXPDoXZlbC4gTWFucm9wZSBNZWRpdW0gNTAwIGVtIGN1cnZhcyBlIGNvbXBvbmVudGVzIGNvbnN0cnXDrWRvcyBnZW9tZXRyaWNhbWVudGUuIEEgc2V0YSBkZXZlIHNlciB2YWxpZGFkYSBhbnRlcyBkYSBtYXJjYSBmaW5hbC48L2Rlc2M+PGcgZmlsbD0iY3VycmVudENvbG9yIiBzdHJva2UtbGluZWNhcD0iYnV0dCIgc3Ryb2tl >\u003ch2>Uma boa cotação começa com a informação certa.\u003c/h2>\u003cp class=\"support\">Para reposição ou projeto novo, organize os dados do componente antes de consultar.\u003c/p>\u003ca class=\"button light arrow\" href=\"#/contato/\">Preparar minha cotação\u003c/a>\u003c/div>\u003cdiv class=\"steps\">\u003cdiv class=\"step\">\u003cspan class=\"step-num\">01\u003c/span>\u003cdiv>\u003ch3>Identifique o componente\u003c/h3>\u003cp>Part number, fabricante e marcações. Se não tiver o código, descreva a função.\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"step\">\u003cspan class=\"step-num\">02\u003c/span>\u003cdiv>\u003ch3>Conte como ele será usado\u003c/h3>\u003cp>Quantidade, aplicação, tensão, corrente, montagem e condições relevantes.\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"step\">\u003cspan class=\"step-num\">03\u003c/span>\u003cdiv>\u003ch3>Confirme antes de decidir\u003c/h3>\u003cp>Especificação, disponibilidade, prazo e condições comerciais são avaliados na consulta.\u003c/p>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003c/section>\n\u003csection class=\"section wrap\">\u003cdiv class=\"section-head\">\u003cdiv>\u003cdiv class=\"eyebrow\">Conhecimento que ajuda\u003c/div>\u003ch2>Mais clareza na seleção.\u003c/h2>\u003c/div>\u003ca class=\"text-link\" href=\"#/recursos/\">Todos os recursos\u003c/a>\u003c/div>\u003cdiv class=\"guide-grid\">\u003carticle class=\"guide-card\">\u003cdiv class=\"meta\">Sobrecorrente · leitura de 4 min\u003c/div>\u003ch3>\u003ca href=\"#/guias/como-especificar-um-fusivel/\">Como especificar um fusível para cotação\u003c/a>\u003c/h3>\u003cp>Corrente nominal é só o começo. Reúna os dados que ajudam a identificar a família correta e a comparar uma possível substituição.\u003c/p>\u003ca class=\"text-link\" href=\"#/guias/como-especificar-um-fusivel/\">Ler guia\u003c/a>\u003c/article>\u003carticle class=\"guide-card\">\u003cdiv class=\"meta\">Sobretensão · leitura de 3 min\u003c/div>\u003ch3>\u003ca href=\"#/guias/tvs-mov-ou-esd/\">TVS, MOV ou proteção ESD?\u003c/a>\u003c/h3>\u003cp>A tecnologia de proteção começa pelo evento que seu circuito precisa suportar. Um número de potência, isoladamente, não resolve a escolha.\u003c/p>\u003ca class=\"text-link\" href=\"#/guias/tvs-mov-ou-esd/\">Ler guia\u003c/a>\u003c/article>\u003carticle class=\"guide-card\">\u003cdiv class=\"meta\">Temperatura · leitura de 3 min\u003c/div>\u003ch3>\u003ca href=\"#/guias/ntc-temperatura-ou-corrente-de-partida/\">NTC para temperatura ou corrente de partida?\u003c/a>\u003c/h3>\u003cp>A sigla é a mesma, mas a função muda os critérios. Descubra quais informações reunir para cada aplicação.\u003c/p>\u003ca class=\"text-link\" href=\"#/guias/ntc-temperatura-ou-corrente-de-partida/\">Ler guia\u003c/a>\u003c/article>\u003c/div>\u003c/section>\u003csection class=\"section compact wrap\">\u003cdiv class=\"cta-box\">\u003cdiv>\u003ch2>Já tem um código em mãos?\u003c/h2>\u003cp>Envie o part number, a quantidade e a aplicação.\u003c/p>\u003c/div>\u003ca class=\"button arrow\" href=\"#/contato/\">Solicitar cotação\u003c/a>\u003c/div>\u003c/section>\u003c/main>\u003cfooter class=\"footer\">\u003cdiv class=\"wrap\">\u003cdiv class=\"footer-main\">\u003cdiv>\u003ca class=\"brand\" href=\"#/\" aria-label=\"Digiquality, página inicial\">\u003cimg src=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA1OTkuMzUwIDE1MCIgc3R5bGU9ImNvbG9yOiMwMDgwMDAiIHJvbGU9ImltZyI+PHRpdGxlPkRpZ2lxdWFsaXR5IHByb3Bvc3RhIEEgLSBoaXDDs3Rlc2UgTlBOPC90aXRsZT48ZGVzYz5Fc3R1ZG8gcmV2aXPDoXZlbC4gTWFucm9wZSBNZWRpdW0gNTAwIGVtIGN1cnZhcyBlIGNvbXBvbmVudGVzIGNvbnN0cnXDrWRvcyBnZW9tZXRyaWNhbWVudGUuIEEgc2V0YSBkZXZlIHNlciB2YWxpZGFkYSBhbnRlcyBkYSBtYXJjYSBmaW5hbC48L2Rlc2M+PGcgZmlsbD0iY3VycmVudENvbG9yIiBzdHJva2UtbGluZWNhcD0iYnV0dCIgc3Ryb2tlLWxpbmVqb2luPSJyb3VuZCI+PHBhdGggdHJhbnNmb3JtPSJ0cmFuc2xhdGUoMjkuMDAwIDEwMC4wMDApIHNjYWxlKDAuMDUwMDAwIC0wLjA1MDAwMCkiIGQ9Ik0xNDAgMFYxNDQwSDU4NFE2MDYgMTQ0MCA2NjEuMCAxNDM5LjBRNzE2IDE0MzggNz ote-link\" href=\"#/contato/\">Solicitar cotação ↗\u003c/a>\u003c/nav>\u003c/div>\u003c/header>\u003cmain id=\"conteudo\">\u003cdiv class=\"wrap\">\u003cnav class=\"breadcrumb\" aria-label=\"Você está em\">\u003ca href=\"#/\">Início\u003c/a>\u003cspan aria-hidden=\"true\">/\u003c/span>\u003ca href=\"#/catalogo/\">Componentes\u003c/a>\u003cspan aria-hidden=\"true\">/\u003c/span>\u003cspan aria-current=\"page\">Fusíveis\u003c/span>\u003c/nav>\u003cdiv class=\"page-hero category-intro\">\u003cdiv>\u003cdiv class=\"eyebrow\">Proteção contra sobrecorrente\u003c/div>\u003ch1>Fusíveis\u003c/h1>\u003cp class=\"lead\">Da placa eletrônica à aplicação de potência: encontre a família de fusível e organize as especificações para sua cotação.\u003c/p>\u003c/div>\u003cdiv class=\"category-visual\">\u003csvg class=\"\" viewBox=\"0 0 120 88\" aria-hidden=\"true\">\u003cpath d=\"M8 42h17m70 0h17\"/>\u003crect x=\"25\" y=\"25\" width=\"70\" height=\"34\" rx=\"3\"/>\u003cpath d=\"M37 25v34M83 25v34M38 42h8l5-7 8 14 8-14 7 7h9\"/>\u003c/svg>\u003cp>Representação esquemática ilustrativa da família\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"content-grid section compact\">\u003carticle>\u003csection>\u003ch2>O que faz\u003c/h2>\u003cp>Fusíveis protegem circuitos contra sobrecorrente pela abertura de um elemento fusível. A escolha considera a corrente de operação, a tensão AC ou DC, a capacidade de interrupção, a curva tempo-corrente e o ambiente térmico.\u003c/p>\u003cdiv class=\"pills\">\u003cspan class=\"pill\">Vidro e cerâmico\u003c/span>\u003cspan class=\"pill\">Axiais e Micro/Pico\u003c/span>\u003cspan class=\"pill\">SMD\u003c/span>\u003cspan class=\"pill\">Automotivos ATO, MINI e MAXI\u003c/span>\u003cspan class=\"pill\">Automotivos MIDI e MEGA\u003c/span>\u003cspan class=\"pill\">Industriais, alarme e ultrarrápidos\u003c/span>\u003c/div>\u003c/section>\u003csection>\u003ch2>O que observar na seleção\u003c/h2>\u003cdl class=\"spec-grid\">\u003cdiv class=\"spec-item\">\u003cdt>Corrente e temperatura\u003c/dt>\u003cdd>Corrente normal, partida e temperatura próxima ao fusível.\u003c/dd>\u003c/div>\u003cdiv class=\"spec-item\">\u003cdt>Tensão e interrupção\u003c/dt>\u003cdd>Tensão AC/DC e corrente de curto-circuito prevista.\u003c/dd>\u003c/div>\u003cdiv class=\"spec-item\">\u003cdt>Atuação\u003c/dt>\u003cdd>Curva tempo-corrente e I²t compatíveis com a aplicação.\u003c/dd>\u003c/div>\u003cdiv class=\"spec-item\">\u003cdt>Dimensão e montagem\u003c/dt>\u003cdd>Formato, medidas e tipo de terminação do componente.\u003c/dd>\u003c/div>\u003c/dl>\u003cp class=\"notice\">A seleção exige validação no circuito e consulta ao datasheet vigente do código escolhido. Esta página é um ponto de partida, não uma aprovação de equivalência.\u003c/p>\u003c/section>\u003csection class=\"faq\">\u003ch2>Dúvidas de seleção\u003c/h2>\u003cdetails>\u003csummary>Posso substituir um fusível apenas pela corrente?\u003c/summary>\u003cp>Não. Dois fusíveis com a mesma corrente nominal podem ter curvas de atuação e capacidades de interrupção diferentes. Tensão, dimensões, temperatura e requisitos do equipamento também precisam ser verificados.\u003c/p>\u003c/details>\u003cdetails>\u003csummary>Qual a diferença entre rápido e retardado?\u003c/summary>\u003cp>A característica de atuação descreve como o fusível responde à corrente ao longo do tempo. A opção retardada pode suportar determinados picos de partida, dentro da curva de sua série. A seleção depende do circuito e do datasheet.\u003c/p>\u003c/details>\u003c/section>\u003csection>\u003ch2 id=\"documentacao\">Documentação de referência\u003c/h2>\u003cul class=\"source-list\">\u003cli>\u003ca href=\"https://www.littelfuse.com/assetdocs/fuseology-selection-guide?assetguid=d812dff2-1c47-4dc3-bce7-07a4001ddc32\" target=\"_blank\" rel=\"noopener noreferrer\">Fuseology Design Guide · Littelfuse ↗\u003c/a>\u003csmall>PDF técnico · edição ©2022 · consultado em 11/10/2026\u003c/small>\u003c/li>\u003c/ul>\u003cp class=\"reading-meta\">Referências técnicas externas. A menção a fabricantes não implica representação comercial atual ou disponibilidade.\u003c/p>\u003c/section>\u003csection>\u003cdiv class=\"eyebrow\">Continue explorando\u003c/div>\u003ch3>\u003ca href=\"#/guias/como-especificar-um-fusivel/\">Como especificar um fusível para cotação ↗\u003c/a>\u003c/h3>\u003cp>Corrente nominal é só o começo. Reúna os dados que ajudam a identificar a família correta e a comparar uma possível substituição.\u003c/p>\u003c/section>\u003c/article>\u003caside class=\"sidebar\">\u003cspan class=\"eyebrow\">Próximo passo\u003c/span>\u003ch2>Vamos ao componente certo.\u003c/h2>\u003cp>Conte o que você precisa. Código, quantidade e aplicação ajudam a preparar a consulta.\u003c/p>\u003ca class=\"button arrow\" href=\"#/contato/?categoria=Fus%C3%ADveis\">Solicitar cotação\u003c/a>\u003chr>\u003ch3>Para ter em mãos\u003c/h3>\u003cul>\u003cli>01 · Código e fabricante\u003c/li>\u003cli>02 · Quantidade necessária\u003c/li>\u003cli>03 · Aplicação e especificações\u003c/li>\u003cli>04 · Prazo desejado\u003c/li>\u003c/ul>\u003cp class=\"no-margin\">Disponibilidade, compatibilidade e condições comerciais precisam de confirmação.\u003c/p>\u003c/aside>\u003c/div>\u003c/div>\u003c/main>\u003cfooter class=\"footer\">\u003cdiv class=\"wrap\">\u003cdiv class=\"footer-main\">\u003cdiv>\u003ca class=\"brand\" href=\"#/\" aria-label=\"Digiquality, página inicial\">\u003cimg src=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA1OTkuMzUwIDE1MCIgc3R5bGU9ImNvbG9yOiMwMDgwMDAiIHJvbGU9ImltZyI+PHRpdGxlPkRpZ2lxdWFsaXR5IHByb3Bvc3RhIEEgLSBoaXDDs3Rlc2UgTlBOPC90aXRsZT48ZGVzYz5Fc3R1ZG8gcmV2aXPDoXZlbC4gTWFucm9wZSBNZWRpdW0gNTAwIGVtIGN1cnZhcyBlIGNvbXBvbmVudGVzIGNvbnN0cnXDrWRvcyBnZW9tZXRyaWNhbWVudGUuIEEgc2V0YSBkZXZlIHNlciB2YWxpZGFkYSBhbnRlcyBkYSBtYXJjYSBmaW5hbC48L2Rlc2M+PGcgZmlsbD0iY3VycmVudENvbG9yIiBzdHJva2UtbGluZWNhcD0iYnV0dCIgc3Ryb2tlLWxpbmVqb2luPSJyb3VuZCI+PHBhdGggdHJhbnNmb3JtPSJ0cmFuc2xhdGUo "page\">Componentes\u003c/a>\u003ca href=\"#/recursos/\">Recursos técnicos\u003c/a>\u003ca href=\"#/empresa/\">A Digiquality\u003c/a>\u003ca class=\"quote-link\" href=\"#/contato/\">Solicitar cotação ↗\u003c/a>\u003c/nav>\u003c/div>\u003c/header>\u003cmain id=\"conteudo\">\u003cdiv class=\"wrap\">\u003cnav class=\"breadcrumb\" aria-label=\"Você está em\">\u003ca href=\"#/\">Início\u003c/a>\u003cspan aria-hidden=\"true\">/\u003c/span>\u003ca href=\"#/catalogo/\">Componentes\u003c/a>\u003cspan aria-hidden=\"true\">/\u003c/span>\u003cspan aria-current=\"page\">NTC e sensores\u003c/span>\u003c/nav>\u003cdiv class=\"page-hero category-intro\">\u003cdiv>\u003cdiv class=\"eyebrow\">Temperatura e corrente de partida\u003c/div>\u003ch1>NTC e sensores de temperatura\u003c/h1>\u003cp class=\"lead\">Medição térmica e limitação de corrente de partida exigem especificações diferentes, mesmo quando ambas usam termistores NTC.\u003c/p>\u003c/div>\u003cdiv class=\"category-visual\">\u003csvg class=\"\" viewBox=\"0 0 120 88\" aria-hidden=\"true\">\u003ccircle cx=\"60\" cy=\"31\" r=\"21\"/>\u003cpath d=\"M49 50v27m22-27v27M42 42l35-25M40 42h9M49 42v9\"/>\u003c/svg>\u003cp>Representação esquemática ilustrativa da família\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"content-grid section compact\">\u003carticle>\u003csection>\u003ch2>O que faz\u003c/h2>\u003cp>A resistência de um termistor NTC diminui com o aumento da temperatura. Alguns dispositivos são projetados para medição térmica; outros, para limitar a corrente de partida. Especifique a função antes de comparar componentes.\u003c/p>\u003cdiv class=\"pills\">\u003cspan class=\"pill\">NTC para corrente de partida\u003c/span>\u003cspan class=\"pill\">Termistores para medição\u003c/span>\u003cspan class=\"pill\">Referências históricas SP e TDC\u003c/span>\u003c/div>\u003c/section>\u003csection>\u003ch2>O que observar na seleção\u003c/h2>\u003cdl class=\"spec-grid\">\u003cdiv class=\"spec-item\">\u003cdt>Função na aplicação\u003c/dt>\u003cdd>Medição de temperatura ou limitação de corrente de partida.\u003c/dd>\u003c/div>\u003cdiv class=\"spec-item\">\u003cdt>Resistência e curva\u003c/dt>\u003cdd>R25, tolerância, beta ou curva resistência-temperatura.\u003c/dd>\u003c/div>\u003cdiv class=\"spec-item\">\u003cdt>Condições elétricas\u003c/dt>\u003cdd>Corrente contínua, energia do evento e requisitos da aplicação.\u003c/dd>\u003c/div>\u003cdiv class=\"spec-item\">\u003cdt>Condições térmicas\u003c/dt>\u003cdd>Faixa de temperatura, resposta, montagem e resfriamento.\u003c/dd>\u003c/div>\u003c/dl>\u003cp class=\"notice\">A seleção exige validação no circuito e consulta ao datasheet vigente do código escolhido. Esta página é um ponto de partida, não uma aprovação de equivalência.\u003c/p>\u003c/section>\u003csection class=\"faq\">\u003ch2>Dúvidas de seleção\u003c/h2>\u003cdetails>\u003csummary>Um NTC de medição pode limitar a corrente de partida?\u003c/summary>\u003cp>Não assuma essa equivalência. Os dispositivos são dimensionados para funções diferentes. Corrente contínua, energia e construção precisam atender à aplicação.\u003c/p>\u003c/details>\u003cdetails>\u003csummary>Resistência e tamanho identificam um substituto?\u003c/summary>\u003cp>Não. Curva resistência-temperatura, tolerância, limites de corrente e energia, montagem e comportamento térmico também precisam ser comparados.\u003c/p>\u003c/details>\u003c/section>\u003csection>\u003ch2 id=\"documentacao\">Documentação de referência\u003c/h2>\u003cul class=\"source-list\">\u003cli>\u003ca href=\"https://www.littelfuse.com/products/sensors/temperature-sensors\" target=\"_blank\" rel=\"noopener noreferrer\">Sensores de temperatura · Littelfuse ↗\u003c/a>\u003csmall>Página técnica oficial · consultado em 11/10/2026\u003c/small>\u003c/li>\u003cli>\u003ca href=\"https://www.tdk-electronics.tdk.com/en/530038/products/product-catalog/protection-devices/current-protection/ntc-inrush-current-limiters\" target=\"_blank\" rel=\"noopener noreferrer\">NTC Inrush Current Limiters · TDK ↗\u003c/a>\u003csmall>Referência técnica; não implica representação comercial · consultado em 11/10/2026\u003c/small>\u003c/li>\u003c/ul>\u003cp class=\"reading-meta\">Referências técnicas externas. A menção a fabricantes não implica representação comercial atual ou disponibilidade.\u003c/p>\u003c/section>\u003csection>\u003cdiv class=\"eyebrow\">Continue explorando\u003c/div>\u003ch3>\u003ca href=\"#/guias/ntc-temperatura-ou-corrente-de-partida/\">NTC para temperatura ou corrente de partida? ↗\u003c/a>\u003c/h3>\u003cp>A sigla é a mesma, mas a função muda os critérios. Descubra quais informações reunir para cada aplicação.\u003c/p>\u003c/section>\u003c/article>\u003caside class=\"sidebar\">\u003cspan class=\"eyebrow\">Próximo passo\u003c/span>\u003ch2>Vamos ao componente certo.\u003c/h2>\u003cp>Conte o que você precisa. Código, quantidade e aplicação ajudam a preparar a consulta.\u003c/p>\u003ca class=\"button arrow\" href=\"#/contato/?categoria=NTC%20e%20sensores\">Solicitar cotação\u003c/a>\u003chr>\u003ch3>Para ter em mãos\u003c/h3>\u003cul>\u003cli>01 · Código e fabricante\u003c/li>\u003cli>02 · Quantidade necessária\u003c/li>\u003cli>03 · Aplicação e especificações\u003c/li>\u003cli>04 · Prazo desejado\u003c/li>\u003c/ul>\u003cp class=\"no-margin\">Disponibilidade, compatibilidade e condições comerciais precisam de confirmação.\u003c/p>\u003c/aside>\u003c/div>\u003c/div>\u003c/main>\u003cfooter class=\"footer\">\u003cdiv class=\"wrap\">\u003cdiv class=\"footer-main\">\u003cdiv>\u003ca class=\"brand\" href=\"#/\" aria-label=\"Digiquality, página inicial\">\u003cimg src=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA1OTkuMzUwIDE1MCIgc3R5bGU9ImNvbG9yOiMwMDgwMDAiIHJvbGU9ImltZyI+PHRpdGxlPkRpZ2lxdWFsaXR5IHByb3Bvc3RhIEEgLSBoaXDDs3Rlc2UgTlBOPC90aXRsZT48ZGVzYz5Fc3R1ZG8gcmV2aXPDoXZlbC4gTWFucm9wZSBNZWRpdW0gNTAwIGVtIGN1cnZhcyBlIGNvbXBvbmVudGVzIGNvbnN0cnXDrWRvcyBnZW9tZXRyaWNhbWVudGUuIEEgc2V0YSB a-expanded=\"false\" aria-controls=\"main-nav\">Menu\u003c/button>\u003cnav id=\"main-nav\" class=\"nav\" aria-label=\"Navegação principal\">\u003ca href=\"#/catalogo/\" aria-current=\"page\">Componentes\u003c/a>\u003ca href=\"#/recursos/\">Recursos técnicos\u003c/a>\u003ca href=\"#/empresa/\">A Digiquality\u003c/a>\u003ca class=\"quote-link\" href=\"#/contato/\">Solicitar cotação ↗\u003c/a>\u003c/nav>\u003c/div>\u003c/header>\u003cmain id=\"conteudo\">\u003cdiv class=\"wrap\">\u003cnav class=\"breadcrumb\" aria-label=\"Você está em\">\u003ca href=\"#/\">Início\u003c/a>\u003cspan aria-hidden=\"true\">/\u003c/span>\u003ca href=\"#/catalogo/\">Componentes\u003c/a>\u003cspan aria-hidden=\"true\">/\u003c/span>\u003cspan aria-current=\"page\">Porta-fusíveis e clips\u003c/span>\u003c/nav>\u003cdiv class=\"page-hero category-intro\">\u003cdiv>\u003cdiv class=\"eyebrow\">Conexão e montagem\u003c/div>\u003ch1>Porta-fusíveis e clips\u003c/h1>\u003cp class=\"lead\">Uma conexão compatível é parte da proteção. Explore suportes para placa, painel e outras formas de montagem.\u003c/p>\u003c/div>\u003cdiv class=\"category-visual\">\u003csvg class=\"\" viewBox=\"0 0 120 88\" aria-hidden=\"true\">\u003cpath d=\"M15 27v34h90V27M28 61v12m64-12v12M25 27v17q0 11 11 11V27M95 27v17q0 11-11 11V27\"/>\u003cpath d=\"M41 34h38M41 44h38\"/>\u003c/svg>\u003cp>Representação esquemática ilustrativa da família\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"content-grid section compact\">\u003carticle>\u003csection>\u003ch2>O que faz\u003c/h2>\u003cp>Porta-fusíveis e clips realizam a fixação e a conexão elétrica do fusível. A compatibilidade vai além do tamanho: os limites de corrente, tensão, temperatura e dissipação precisam atender à aplicação.\u003c/p>\u003cdiv class=\"pills\">\u003cspan class=\"pill\">Porta-fusíveis para painel\u003c/span>\u003cspan class=\"pill\">Porta-fusíveis para placa\u003c/span>\u003cspan class=\"pill\">Porta-fusíveis para cabo\u003c/span>\u003cspan class=\"pill\">Clips e acessórios\u003c/span>\u003c/div>\u003c/section>\u003csection>\u003ch2>O que observar na seleção\u003c/h2>\u003cdl class=\"spec-grid\">\u003cdiv class=\"spec-item\">\u003cdt>Compatibilidade física\u003c/dt>\u003cdd>Dimensões, formato e terminais do fusível.\u003c/dd>\u003c/div>\u003cdiv class=\"spec-item\">\u003cdt>Corrente e tensão\u003c/dt>\u003cdd>Valores e condições especificados para o suporte.\u003c/dd>\u003c/div>\u003cdiv class=\"spec-item\">\u003cdt>Montagem\u003c/dt>\u003cdd>Painel, placa, cabo e tipo de terminação.\u003c/dd>\u003c/div>\u003cdiv class=\"spec-item\">\u003cdt>Condição térmica\u003c/dt>\u003cdd>Temperatura ambiente, dissipação e proximidade de outras fontes de calor.\u003c/dd>\u003c/div>\u003c/dl>\u003cp class=\"notice\">A seleção exige validação no circuito e consulta ao datasheet vigente do código escolhido. Esta página é um ponto de partida, não uma aprovação de equivalência.\u003c/p>\u003c/section>\u003csection class=\"faq\">\u003ch2>Dúvidas de seleção\u003c/h2>\u003cdetails>\u003csummary>Um suporte com o mesmo tamanho serve para qualquer fusível?\u003c/summary>\u003cp>Não necessariamente. É preciso conferir a especificação do suporte e do fusível, incluindo corrente, tensão, dissipação e condições térmicas.\u003c/p>\u003c/details>\u003cdetails>\u003csummary>Quais dados enviar para cotar um clip?\u003c/summary>\u003cp>Envie o código original, dimensões do fusível, desenho ou descrição da montagem, tipo de terminal, corrente, tensão e quantidade.\u003c/p>\u003c/details>\u003c/section>\u003csection>\u003ch2 id=\"documentacao\">Documentação de referência\u003c/h2>\u003cul class=\"source-list\">\u003cli>\u003ca href=\"https://www.littelfuse.com/assetdocs/fuseholder-selection-guide?assetguid=e6f2e839-cf96-480b-b61e-b90e27057915\" target=\"_blank\" rel=\"noopener noreferrer\">Fuseholder Selection Guide · Littelfuse ↗\u003c/a>\u003csmall>Guia oficial · data editorial não identificada · consultado em 11/10/2026\u003c/small>\u003c/li>\u003c/ul>\u003cp class=\"reading-meta\">Referências técnicas externas. A menção a fabricantes não implica representação comercial atual ou disponibilidade.\u003c/p>\u003c/section>\u003csection>\u003cdiv class=\"eyebrow\">Continue explorando\u003c/div>\u003ch3>\u003ca href=\"#/guias/como-especificar-um-fusivel/\">Como especificar um fusível para cotação ↗\u003c/a>\u003c/h3>\u003cp>Corrente nominal é só o começo. Reúna os dados que ajudam a identificar a família correta e a comparar uma possível substituição.\u003c/p>\u003c/section>\u003c/article>\u003caside class=\"sidebar\">\u003cspan class=\"eyebrow\">Próximo passo\u003c/span>\u003ch2>Vamos ao componente certo.\u003c/h2>\u003cp>Conte o que você precisa. Código, quantidade e aplicação ajudam a preparar a consulta.\u003c/p>\u003ca class=\"button arrow\" href=\"#/contato/?categoria=Porta-fus%C3%ADveis%20e%20clips\">Solicitar cotação\u003c/a>\u003chr>\u003ch3>Para ter em mãos\u003c/h3>\u003cul>\u003cli>01 · Código e fabricante\u003c/li>\u003cli>02 · Quantidade necessária\u003c/li>\u003cli>03 · Aplicação e especificações\u003c/li>\u003cli>04 · Prazo desejado\u003c/li>\u003c/ul>\u003cp class=\"no-margin\">Disponibilidade, compatibilidade e condições comerciais precisam de confirmação.\u003c/p>\u003c/aside>\u003c/div>\u003c/div>\u003c/main>\u003cfooter class=\"footer\">\u003cdiv class=\"wrap\">\u003cdiv class=\"footer-main\">\u003cdiv>\u003ca class=\"brand\" href=\"#/\" aria-label=\"Digiquality, página inicial\">\u003cimg src=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA1OTkuMzUwIDE1MCIgc3R5bGU9ImNvbG9yOiMwMDgwMDAiIHJvbGU9ImltZyI+PHRpdGxlPkRpZ2lxdWFsaXR5IHByb3Bvc3RhIEEgLSBoaXDDs3Rlc2UgTlBOPC90aXRsZT48ZGVzYz5Fc3R1ZG8gcmV2aXPDoXZlbC4gTWFucm9wZSBNZWRpdW0gNTAwIGVtIGN1cnZhcyBlIGNvbXBvbmVudGVzIGNvbnN0cnXDrWRvcyBnZW9tZXRyaWNhbWVudGUuIEEgc2V0YSBkZXZlIHNlciB2YWxpZGFkYSBhbnRlcyBkYSBtYXJjYSBmaW5hbC48L2Rlc2M+PGcgZmlsbD0iY3VycmVudENvbG9yIiBzdHJva2UtbGluZWNhcD0iYnV0dCIgc3Ryb2tlLWxpbmVqb2luPSJy \">\u003ca href=\"#/catalogo/\" aria-current=\"page\">Componentes\u003c/a>\u003ca href=\"#/recursos/\">Recursos técnicos\u003c/a>\u003ca href=\"#/empresa/\">A Digiquality\u003c/a>\u003ca class=\"quote-link\" href=\"#/contato/\">Solicitar cotação ↗\u003c/a>\u003c/nav>\u003c/div>\u003c/header>\u003cmain id=\"conteudo\">\u003cdiv class=\"wrap\">\u003cnav class=\"breadcrumb\" aria-label=\"Você está em\">\u003ca href=\"#/\">Início\u003c/a>\u003cspan aria-hidden=\"true\">/\u003c/span>\u003ca href=\"#/catalogo/\">Componentes\u003c/a>\u003cspan aria-hidden=\"true\">/\u003c/span>\u003cspan aria-current=\"page\">TVS, MOV e ESD\u003c/span>\u003c/nav>\u003cdiv class=\"page-hero category-intro\">\u003cdiv>\u003cdiv class=\"eyebrow\">Proteção contra sobretensão\u003c/div>\u003ch1>Proteção TVS, MOV e ESD\u003c/h1>\u003cp class=\"lead\">Tecnologias para diferentes transientes. Comece pela tensão de trabalho, pelo evento de surto e pela sensibilidade do circuito.\u003c/p>\u003c/div>\u003cdiv class=\"category-visual\">\u003csvg class=\"\" viewBox=\"0 0 120 88\" aria-hidden=\"true\">\u003ccircle cx=\"60\" cy=\"32\" r=\"23\"/>\u003cpath d=\"M48 52v22m24-22v22M41 38l39-14M47 25h26v15H47z\"/>\u003c/svg>\u003cp>Representação esquemática ilustrativa da família\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"content-grid section compact\">\u003carticle>\u003csection>\u003ch2>O que faz\u003c/h2>\u003cp>Diodos TVS, varistores MOV, dispositivos ESD e tubos de descarga a gás atendem diferentes cenários de sobretensão. A seleção depende da tensão residual admissível, da energia ou corrente do evento e das características do circuito protegido.\u003c/p>\u003cdiv class=\"pills\">\u003cspan class=\"pill\">Diodos TVS\u003c/span>\u003cspan class=\"pill\">Varistores MOV radiais\u003c/span>\u003cspan class=\"pill\">Varistores industriais e SMD\u003c/span>\u003cspan class=\"pill\">Arrays e supressores ESD\u003c/span>\u003cspan class=\"pill\">PulseGuard\u003c/span>\u003cspan class=\"pill\">Tubos de descarga a gás\u003c/span>\u003c/div>\u003c/section>\u003csection>\u003ch2>O que observar na seleção\u003c/h2>\u003cdl class=\"spec-grid\">\u003cdiv class=\"spec-item\">\u003cdt>Tensão de trabalho\u003c/dt>\u003cdd>Tensão contínua e limites de operação do circuito.\u003c/dd>\u003c/div>\u003cdiv class=\"spec-item\">\u003cdt>Tensão de limitação\u003c/dt>\u003cdd>Tensão residual nas condições de ensaio da série.\u003c/dd>\u003c/div>\u003cdiv class=\"spec-item\">\u003cdt>Capacidade de surto\u003c/dt>\u003cdd>Corrente/energia e forma de onda usadas na especificação.\u003c/dd>\u003c/div>\u003cdiv class=\"spec-item\">\u003cdt>Integridade de sinal\u003c/dt>\u003cdd>Capacitância, polaridade, montagem e leiaute da placa.\u003c/dd>\u003c/div>\u003c/dl>\u003cp class=\"notice\">A seleção exige validação no circuito e consulta ao datasheet vigente do código escolhido. Esta página é um ponto de partida, não uma aprovação de equivalência.\u003c/p>\u003c/section>\u003csection class=\"faq\">\u003ch2>Dúvidas de seleção\u003c/h2>\u003cdetails>\u003csummary>TVS, MOV e proteção ESD fazem a mesma coisa?\u003c/summary>\u003cp>Todos podem participar da proteção contra transientes, mas suas características e aplicações são distintas. A comparação exige considerar o evento, a tensão residual, a capacidade de surto e o circuito.\u003c/p>\u003c/details>\u003cdetails>\u003csummary>Posso comparar só a potência de pico?\u003c/summary>\u003cp>Não. A potência e a corrente dependem das condições de ensaio e da forma de onda. Verifique também a tensão de trabalho, a tensão de limitação e o comportamento térmico.\u003c/p>\u003c/details>\u003c/section>\u003csection>\u003ch2 id=\"documentacao\">Documentação de referência\u003c/h2>\u003cul class=\"source-list\">\u003cli>\u003ca href=\"https://www.littelfuse.com/products/overvoltage-protection/tvs-diodes\" target=\"_blank\" rel=\"noopener noreferrer\">Diodos TVS · Littelfuse ↗\u003c/a>\u003csmall>Página técnica oficial · consultado em 11/10/2026\u003c/small>\u003c/li>\u003cli>\u003ca href=\"https://www.littelfuse.com/products/overvoltage-protection/varistors\" target=\"_blank\" rel=\"noopener noreferrer\">Varistores · Littelfuse ↗\u003c/a>\u003csmall>Página técnica oficial · consultado em 11/10/2026\u003c/small>\u003c/li>\u003cli>\u003ca href=\"https://www.littelfuse.com/products/overvoltage-protection/tvs-diode-arrays/connectivity-tvs-diode-arrays/sp4208\" target=\"_blank\" rel=\"noopener noreferrer\">ESD de baixa capacitância · série SP4208 ↗\u003c/a>\u003csmall>Exemplo técnico de fabricante; não confirma oferta pela Digiquality · consultado em 11/10/2026\u003c/small>\u003c/li>\u003c/ul>\u003cp class=\"reading-meta\">Referências técnicas externas. A menção a fabricantes não implica representação comercial atual ou disponibilidade.\u003c/p>\u003c/section>\u003csection>\u003cdiv class=\"eyebrow\">Continue explorando\u003c/div>\u003ch3>\u003ca href=\"#/guias/tvs-mov-ou-esd/\">TVS, MOV ou proteção ESD? ↗\u003c/a>\u003c/h3>\u003cp>A tecnologia de proteção começa pelo evento que seu circuito precisa suportar. Um número de potência, isoladamente, não resolve a escolha.\u003c/p>\u003c/section>\u003c/article>\u003caside class=\"sidebar\">\u003cspan class=\"eyebrow\">Próximo passo\u003c/span>\u003ch2>Vamos ao componente certo.\u003c/h2>\u003cp>Conte o que você precisa. Código, quantidade e aplicação ajudam a preparar a consulta.\u003c/p>\u003ca class=\"button arrow\" href=\"#/contato/?categoria=TVS%2C%20MOV%20e%20ESD\">Solicitar cotação\u003c/a>\u003chr>\u003ch3>Para ter em mãos\u003c/h3>\u003cul>\u003cli>01 · Código e fabricante\u003c/li>\u003cli>02 · Quantidade necessária\u003c/li>\u003cli>03 · Aplicação e especificações\u003c/li>\u003cli>04 · Prazo desejado\u003c/li>\u003c/ul>\u003cp class=\"no-margin\">Disponibilidade, compatibilidade e condições comerciais precisam de confirmação.\u003c/p>\u003c/aside>\u003c/div>\u003c/div>\u003c/main>\u003cfooter class=\"footer\">\u003cdiv class=\"wrap\">\u003cdiv class=\"footer-main\">\u00 a a corrente ao passar para um estado de maior resistência. Seu comportamento depende da corrente, da temperatura e das condições da aplicação. A recuperação deve ser avaliada conforme a série escolhida.\u003c/p>\u003cdiv class=\"pills\">\u003cspan class=\"pill\">PPTC radiais\u003c/span>\u003cspan class=\"pill\">PPTC SMD\u003c/span>\u003cspan class=\"pill\">Terminais para bateria\u003c/span>\u003cspan class=\"pill\">Famílias POLYFUSE\u003c/span>\u003c/div>\u003c/section>\u003csection>\u003ch2>O que observar na seleção\u003c/h2>\u003cdl class=\"spec-grid\">\u003cdiv class=\"spec-item\">\u003cdt>Ihold e Itrip\u003c/dt>\u003cdd>Corrente de manutenção e disparo nas condições de referência.\u003c/dd>\u003c/div>\u003cdiv class=\"spec-item\">\u003cdt>Vmax e Imax\u003c/dt>\u003cdd>Tensão máxima e corrente máxima de falha especificadas.\u003c/dd>\u003c/div>\u003cdiv class=\"spec-item\">\u003cdt>Ambiente e atuação\u003c/dt>\u003cdd>Temperatura, curva de redução e tempo de resposta.\u003c/dd>\u003c/div>\u003cdiv class=\"spec-item\">\u003cdt>Resistência e montagem\u003c/dt>\u003cdd>Resistência inicial/pós-atuação e encapsulamento.\u003c/dd>\u003c/div>\u003c/dl>\u003cp class=\"notice\">A seleção exige validação no circuito e consulta ao datasheet vigente do código escolhido. Esta página é um ponto de partida, não uma aprovação de equivalência.\u003c/p>\u003c/section>\u003csection class=\"faq\">\u003ch2>Dúvidas de seleção\u003c/h2>\u003cdetails>\u003csummary>PTC resetável e fusível são equivalentes?\u003c/summary>\u003cp>Não são intercambiáveis automaticamente. Um PPTC limita corrente aumentando a resistência, enquanto um fusível convencional abre seu elemento. Estado de falha, corrente residual e recuperação precisam ser avaliados.\u003c/p>\u003c/details>\u003cdetails>\u003csummary>O que muda com a temperatura ambiente?\u003c/summary>\u003cp>As correntes de manutenção e de disparo dependem da temperatura. Verifique as curvas e condições da série; não use apenas o valor nominal de referência.\u003c/p>\u003c/details>\u003c/section>\u003csection>\u003ch2 id=\"documentacao\">Documentação de referência\u003c/h2>\u003cul class=\"source-list\">\u003cli>\u003ca href=\"https://www.littelfuse.com/products/fuses-overcurrent-protection/polyswitch-resettable-pptc-devices\" target=\"_blank\" rel=\"noopener noreferrer\">PolySwitch PPTC · Littelfuse ↗\u003c/a>\u003csmall>Página oficial · data editorial não informada · consultado em 11/10/2026\u003c/small>\u003c/li>\u003c/ul>\u003cp class=\"reading-meta\">Referências técnicas externas. A menção a fabricantes não implica representação comercial atual ou disponibilidade.\u003c/p>\u003c/section>\u003csection>\u003cdiv class=\"eyebrow\">Continue explorando\u003c/div>\u003ch3>\u003ca href=\"#/guias/como-especificar-um-fusivel/\">Como especificar um fusível para cotação ↗\u003c/a>\u003c/h3>\u003cp>Corrente nominal é só o começo. Reúna os dados que ajudam a identificar a família correta e a comparar uma possível substituição.\u003c/p>\u003c/section>\u003c/article>\u003caside class=\"sidebar\">\u003cspan class=\"eyebrow\">Próximo passo\u003c/span>\u003ch2>Vamos ao componente certo.\u003c/h2>\u003cp>Conte o que você precisa. Código, quantidade e aplicação ajudam a preparar a consulta.\u003c/p>\u003ca class=\"button arrow\" href=\"#/contato/?categoria=PTC%20reset%C3%A1veis\">Solicitar cotação\u003c/a>\u003chr>\u003ch3>Para ter em mãos\u003c/h3>\u003cul>\u003cli>01 · Código e fabricante\u003c/li>\u003cli>02 · Quantidade necessária\u003c/li>\u003cli>03 · Aplicação e especificações\u003c/li>\u003cli>04 · Prazo desejado\u003c/li>\u003c/ul>\u003cp class=\"no-margin\">Disponibilidade, compatibilidade e condições comerciais precisam de confirmação.\u003c/p>\u003c/aside>\u003c/div>\u003c/div>\u003c/main>\u003cfooter class=\"footer\">\u003cdiv class=\"wrap\">\u003cdiv class=\"footer-main\">\u003cdiv>\u003ca class=\"brand\" href=\"#/\" aria-label=\"Digiquality, página inicial\">\u003cimg src=\"data:image/svg+xml;base64,PHN2Zy m sentido; TRIACs permitem controle bidirecional em circuitos AC. SIDACtor é uma família de tiristores de proteção contra sobretensão, com função distinta dos dispositivos de controle de potência.\u003c/p>\u003cdiv class=\"pills\">\u003cspan class=\"pill\">SCR\u003c/span>\u003cspan class=\"pill\">TRIAC\u003c/span>\u003cspan class=\"pill\">SIDACtor de proteção\u003c/span>\u003c/div>\u003c/section>\u003csection>\u003ch2>O que observar na seleção\u003c/h2>\u003cdl class=\"spec-grid\">\u003cdiv class=\"spec-item\">\u003cdt>Função do componente\u003c/dt>\u003cdd>Controle de potência ou proteção contra sobretensão.\u003c/dd>\u003c/div>\u003cdiv class=\"spec-item\">\u003cdt>Tensão e corrente\u003c/dt>\u003cdd>Limites elétricos em regime e nas condições transitórias.\u003c/dd>\u003c/div>\u003cdiv class=\"spec-item\">\u003cdt>Disparo e comutação\u003c/dt>\u003cdd>Gate, dv/dt e parâmetros próprios de cada família.\u003c/dd>\u003c/div>\u003cdiv class=\"spec-item\">\u003cdt>Montagem e calor\u003c/dt>\u003cdd>Encapsulamento, terminais e requisitos térmicos.\u003c/dd>\u003c/div>\u003c/dl>\u003cp class=\"notice\">A seleção exige validação no circuito e consulta ao datasheet vigente do código escolhido. Esta página é um ponto de partida, não uma aprovação de equivalência.\u003c/p>\u003c/section>\u003csection class=\"faq\">\u003ch2>Dúvidas de seleção\u003c/h2>\u003cdetails>\u003csummary>SIDACtor substitui um TRIAC?\u003c/summary>\u003cp>Não automaticamente. São componentes com funções diferentes. SIDACtor é uma família de proteção contra sobretensão; a comparação deve partir do código e do circuito.\u003c/p>\u003c/details>\u003cdetails>\u003csummary>Basta comparar tensão e corrente?\u003c/summary>\u003cp>Não. Os parâmetros de disparo, comutação, surto e dissipação, além do encapsulamento, precisam ser compatíveis com a aplicação.\u003c/p>\u003c/details>\u003c/section>\u003csection>\u003ch2 id=\"documentacao\">Documentação de referência\u003c/h2>\u003cul class=\"source-list\">\u003cli>\u003ca href=\"https://www.littelfuse.com/assetdocs/gating-latching-and-holding-of-scrs-and-triacs-application-note?assetguid=0a78b99f-fe06-4a32-b2aa-4d45f60ca536\" target=\"_blank\" rel=\"noopener noreferrer\">Gating, Latching and Holding of SCRs and TRIACs · Littelfuse ↗\u003c/a>\u003csmall>Nota técnica AN1002 · edição ©2008 · referência conceitual · consultado em 11/10/2026\u003c/small>\u003c/li>\u003cli>\u003ca href=\"https://www.littelfuse.com/products/overvoltage-protection/sidactor-protection-thyristors/high-exposure-surge-protection/pxxx0fnl\" target=\"_blank\" rel=\"noopener noreferrer\">SIDACtor Pxxx0FNL · Littelfuse ↗\u003c/a>\u003csmall>Exemplo técnico de fabricante; não confirma oferta pela Digiquality · consultado em 11/10/2026\u003c/small>\u003c/li>\u003c/ul>\u003cp class=\"reading-meta\">Referências técnicas externas. A menção a fabricantes não implica representação comercial atual ou disponibilidade.\u003c/p>\u003c/section>\u003csection>\u003cdiv class=\"eyebrow\">Continue explorando\u003c/div>\u003ch3>\u003ca href=\"#/guias/tvs-mov-ou-esd/\">TVS, MOV ou proteção ESD? ↗\u003c/a>\u003c/h3>\u003cp>A tecnologia de proteção começa pelo evento que seu circuito precisa suportar. Um número de potência, isoladamente, não resolve a escolha.\u003c/p>\u003c/section>\u003c/article>\u003caside class=\"sidebar\">\u003cspan class=\"eyebrow\">Próximo passo\u003c/span>\u003ch2>Vamos ao componente certo.\u003c/h2>\u003cp>Conte o que você precisa. Código, quantidade e aplicação ajudam a preparar a consulta.\u003c/p>\u003ca class=\"button arrow\" href=\"#/contato/?categoria=SCR%2C%20TRIAC%20e%20SIDACtor\">Solicitar cotação\u003c/a>\u003chr>\u003ch3>Para ter em mãos\u003c/h3>\u003cul>\u003cli>01 · Código e fabricante\u003c/li>\u003cli>02 · Quantidade necessária\u003c/li>\u003cli>03 · Aplicação e especificações\u003c/li>\u003cli>04 · Prazo desejado\u003c/li>\u003c/ul>\u003cp class=\"no-margin\">Disponibilidade, compatibilidade e condições comerciais precisam de confirmação.\u003c/p>\u003c/aside>\u003c/div>\u003c/div>\u003c/main>\u003cfooter class=\"footer\">\u003cdiv class=\"wrap\">\u003cdiv class=\"footer-main\">\u003cdiv>\u003ca class=\"brand\" href=\"#/\" aria-label=\"Digiquality, página inicial\">\u003cimg src=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA1OTkuMzUwIDE1MCIgc3R5bGU9ImNvbG9yOiMwMDgwMDAiIHJvbGU9ImltZyI+PHRpdGxlPkRpZ2lxdWFsaXR5IHByb3Bvc3RhIEEgLSBoaXDDs3Rlc2UgTlBOPC90aXRsZT48ZGVzYz5Fc3R1ZG8gcmV2aXPDoXZlbC4gTWFucm9wZSBNZWRpdW0gNTAwIGVtIGN1cnZhcyBlIGNvbXBvbmVudGVzIGNvbnN0cnXDrWRvcyBnZW9tZXRyaWNhbWVudGUuIEEgc2V0YSBkZXZlIHNlciB2YWxpZGFkYSBhbnRlcyBkYSBtYXJjYSBmaW5hbC48L2Rlc2M+PGcgZmlsbD0iY3VycmVudENvbG9yIiBzdHJva2UtbGluZWNhcD0iYnV0dCIgc3Ryb2tlLWxpbmVqb2luPSJyb3VuZCI+PHBhdGggdHJhbnNmb3JtPSJ0cmFuc2xhdGUoMjkuMDAwIDEwMC4wMDApIHNjYWxlKDAuMDUwMDAwIC0wLjA1MDAwMCkiIGQ9Ik0xNDAgMFYxNDQwSDU4NFE2MDYgMTQ0MCA2NjEuMCAxNDM5LjBRNzE2IDE0MzggNzY2IDE0MzFROTMzIDE0MDkgMTA0NS41IDEzMDkuNVExMTU4IDEyMTAgMTIxNS4wIDEwNTcuMFExMjcyIDkwNCAxMjcyIDcyMFExMjcyIDUzNiAxMjE1LjAgMzgzLjBRMTE1OCAyMzAgMTA0NS41IDEzMC41UTkzMyAzMSA3NjYgOVE3MTYgMyA2NjAuNSAxLjVRNjA1IDAgNTg0IDBaTTMyMyAxNzBINTg0UTYyMiAxNzAgNjY5LjAgMTcyLjVRNzE2IDE3NSA3NTEgMTgxUTg2OSAyMDMgOTQyLjAgMjgwLjBRMTAxNSAzNTcgMTA0OS4wIDQ3Mi4wUTEwODMgNTg3IDEwODMgNzIwUTEwODMgODU2IDEwNDguNSA5NzEuMFExMDE0IDEwODYgOTQxLjAgMTE2Mi4wUTg2OCAxMjM4IDc1MSAxMjU5UTcxNiAxMjY2IDY2OC4wIDEyNjguMFE2MjAgMTI3MCA1ODQgMTI3MEgzMjNaIi8+PHBhdGggZD0iTTEyLjAwMCA0Ny4wMDAgTDM5LjAwMCA0Ny4wMDAiIGZpbGw9Im5vbmUiIHN0cm9rZT0iY3VycmVudENvbG9yIiBzdHJva2Utd2lkdGg9IjQuNSIvPjxwYXRoIGQ9Ik0xMi4wMDAgODEuMDAwIEwzOS4wMDAgODEuMDAwIiBmaWxsPSJub25lIiBzdHJva2U9ImN1cnJlbnRDb2xvciIgc3Ryb2tlLXdpZHRoPSI0LjUiLz48Y2lyY2xlIGN4PSIxMDAuMSIgY3k9IjY0IiByPSI2LjIiIGZpbGw9Im5vbmUiIHN0cm9rZT0iY3VycmVudENvbG9yIiBzdHJva2Utd2lkdGg9IjMuNSIvPjxwYXRoIGQ9Ik0xMDcuMDAwIDY0LjAwMCBMMTI1LjUwMCA2NC4wMDAiIGZpbGw9Im5vbmUiIHN0cm9rZT0iY3VycmVudENvbG9yIiBzdHJva2Utd2lkdGg9IjQuNSIvPjxwYXRoIHRyYW5zZm9ybT0idHJhbnNsYXRlKDExNy4wMDAgMTAwLjAwMCkgc2Nhb ia correta e a comparar uma possível substituição.\u003c/p>\u003ca class=\"text-link\" href=\"#/guias/como-especificar-um-fusivel/\">Ler guia\u003c/a>\u003c/article>\u003carticle class=\"guide-card\">\u003cdiv class=\"meta\">Sobretensão · leitura de 3 min\u003c/div>\u003ch3>\u003ca href=\"#/guias/tvs-mov-ou-esd/\">TVS, MOV ou proteção ESD?\u003c/a>\u003c/h3>\u003cp>A tecnologia de proteção começa pelo evento que seu circuito precisa suportar. Um número de potência, isoladamente, não resolve a escolha.\u003c/p>\u003ca class=\"text-link\" href=\"#/guias/tvs-mov-ou-esd/\">Ler guia\u003c/a>\u003c/article>\u003carticle class=\"guide-card\">\u003cdiv class=\"meta\">Temperatura · leitura de 3 min\u003c/div>\u003ch3>\u003ca href=\"#/guias/ntc-temperatura-ou-corrente-de-partida/\">NTC para temperatura ou corrente de partida?\u003c/a>\u003c/h3>\u003cp>A sigla é a mesma, mas a função muda os critérios. Descubra quais informações reunir para cada aplicação.\u003c/p>\u003ca class=\"text-link\" href=\"#/guias/ntc-temperatura-ou-corrente-de-partida/\">Ler guia\u003c/a>\u003c/article>\u003c/div>\u003c/section>\u003csection class=\"section compact\">\u003cdiv class=\"section-head\">\u003cdiv>\u003cdiv class=\"eyebrow\">Fontes oficiais\u003c/div>\u003ch2>Biblioteca de referências.\u003c/h2>\u003c/div>\u003cp>Links externos. Consulte sempre a revisão vigente do código específico.\u003c/p>\u003c/div>\u003cdiv class=\"resource-list\">\u003cdiv class=\"resource-row\">\u003cspan class=\"index\">01\u003c/span>\u003cdiv>\u003ch3>Fusíveis\u003c/h3>\u003cp>PDF técnico · edição ©2022\u003cbr>Fonte: Fuseology Design Guide · Littelfuse · consulta 11/10/2026\u003c/p>\u003c/div>\u003ca class=\"text-link\" href=\"#/produtos/fusiveis/#documentacao\">Ver referências\u003c/a>\u003c/div>\u003cdiv class=\"resource-row\">\u003cspan class=\"index\">02\u003c/span>\u003cdiv>\u003ch3>Porta-fusíveis e clips\u003c/h3>\u003cp>Guia oficial · data editorial não identificada\u003cbr>Fonte: Fuseholder Selection Gui são apresentados como fatos confirmados.\u003c/p>\u003c/section>\u003csection>\u003ch2>Público, mas fora da busca\u003c/h2>\u003cp>Quem tiver o link pode abrir e compartilhar a prévia. As páginas solicitam aos buscadores compatíveis que não as indexem. Isso não é controle de acesso, e o código-fonte do repositório é público.\u003c/p>\u003c/section>\u003csection>\u003ch2>Dados e recursos externos\u003c/h2>\u003cp>Não adicionamos analytics, rastreadores, cookies próprios ou serviços de formulário. Links de fabricantes, GitHub e seu provedor de e-mail operam sob suas próprias condições. O formulário usa somente memória temporária da página para preparar o texto.\u003c/p>\u003c/section>\u003csection>\u003ch2>Antes da publicação definitiva\u003c/h2>\u003cp>Revisar informações com a empresa, validar o fluxo de atendimento e aprovar a migração. O domínio e a hospedagem atuais não foram alterados por esta prévia.\u003c/p>\u003c/section>\u003c/article>\u003caside class=\"sidebar\">\u003cspan class=\"eyebrow\">Próximo passo\u003c/span>\u003ch2>Vamos ao componente certo.\u003c/h2>\u003cp>Conte o que você precisa. Código, quantidade e aplicação ajudam a preparar a consulta.\u003c/p>\u003ca class=\"button arrow\" href=\"#/contato/\">Solicitar cotação\u003c/a>\u003chr>\u003ch3>Para ter em mãos\u003c/h3>\u003cul>\u003cli>01 · Código e fabricante\u003c/li>\u003cli>02 · Quantidade necessária\u003c/li>\u003cli>03 · Aplicação e especificações\u003c/li>\u003cli>04 · Prazo desejado\u003c/li>\u003c/ul>\u003cp class=\"no-margin\">Disponibilidade, compatibilidade e condições comerciais precisam de confirmação.\u003c/p>\u003c/aside>\u003c/div>\u003c/div>\u003c/main>\u003cfooter class=\"footer\">\u003cdiv class=\"wrap\">\u003cdiv class=\"footer-main\">\u003cdiv>\u003ca class=\"brand\" href=\"#/\" aria-label=\"Digiquality, página inicial\">\u003cimg src=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA1OTkuMzUwIDE1MCIgc3R5bGU9ImNvbG9yOiMwMDgwM let pageController;
function initPage(){(() => {
  'use strict';
  const menu = document.querySelector('.menu-toggle');
  const nav = document.querySelector('#main-nav');
  if (menu && nav) {
    const close = () => { nav.classList.remove('open'); menu.setAttribute('aria-expanded', 'false'); menu.textContent = 'Menu'; };
    menu.addEventListener('click', () => { const open = menu.getAttribute('aria-expanded') !== 'true'; nav.classList.toggle('open', open); menu.setAttribute('aria-expanded', String(open)); menu.textContent = open ? 'Fechar' : 'Menu'; });
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && menu.getAttribute('aria-expanded') === 'true') { close(); menu.focus(); } }, {signal: pageController.signal});
    nav.querySelectorAll('a').forEach(a => a.addEventListener('click', close));
    window.addEventListener('resize', () => { if (window.innerWidth > 850) close(); }, {signal: pageController.signal});
  }
  const norm = text => text.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[-–—]/g, ' ').toLowerCase();
  const search = document.querySelector('#catalog-search');
  if (search) {
    const filter = document.querySelector('#catalog-filter');
    const cards = [...document.querySelectorAll('[data-search]')];
    const count = document.querySelector('#search-count');
    const empty = document.querySelector('#empty-results');
    const run = () => {
      const terms = norm(search.value.trim()).split(/\s+/).filter(Boolean);
      let visible = 0;
      cards.forEach(card => { const match = terms.every(term => norm(card.dataset.search).includes(term)) && (!filter.value || card.dataset.function.split(/\s+/).includes(filter.value)); card.hidden = !match; if (match) visible++; });
      count.textContent = visible === 6 && !terms.length && !filter.value ? '6 famílias de componentes para explorar.' : `${visible} ${visible === 1 ? 'família encontrada' : 'famílias encontradas'}.`;
      empty.hidden = visible !== 0;
    };
    search.addEventListener('input', run); filter.addEventListener('change', run);
    document.querySelector('#clear-search').addEventListener('click', () => { search.value = ''; filter.value = ''; run(); search.focus(); });
    run();
  }
  const form = document.querySelector('#quote-form');
  if (form) {
    const output = document.querySelector('#quote-output');
    const message = document.querySelector('#quote-message');
    const status = document.querySelector('#copy-status');
    const query = new URLSearchParams(window.previewQuery).get('categoria');
    if (query && [...form.elements.category.options].some(o => o.value === query)) form.elements.category.value = query;
    form.addEventListener('submit', event => {
      event.preventDefault();
      if (!form.reportValidity()) return;
      const data = new FormData(form);
      const val = key => String(data.get(key) || '').trim();
      const text = [
        'Olá, equipe Digiquality.', '', 'Gostaria de solicitar uma cotação:', '',
        `Componente / código: ${val('part')}`, `Quantidade: ${val('quantity')}`, `Família: ${val('category') || 'A identificar'}`,
        `Aplicação e especificações: ${val('application') || 'A complementar'}`, `Prazo desejado: ${val('deadline') || 'A combinar'}`,
        '', `Nome: ${val('name')}`, `Empresa: ${val('company') || 'Não informada'}`, `E-mail para retorno: ${val('email')}`,
        '', 'Por favor, confirmem especificação, disponibilidade, prazo e condições comerciais.'
      ].join('\n');
      message.value = text;
      document.querySelector('#open-email').href = 'mailto:vendas@digiquality.com.br?subject=' + encodeURIComponent('Cotação Digiquality | ' + val('part').slice(0,100)) + '&body=' + encodeURIComponent(text);
      output.hidden = false; status.textContent = 'Mensagem preparada. Nada foi enviado.'; output.scrollIntoView({behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth',block:'center'}); message.focus();
    });
    document.querySelector('#copy-message').addEventListener('click', async () => {
      try { await navigator.clipboard.writeText(message.value); status.textContent = 'Mensagem copiada. Cole no seu e-mail e envie para vendas@digiquality.com.br.'; }
      catch { message.focus(); message.select(); status.textContent = 'Selecione e copie o texto acima manualmente.'; }
    });
    document.querySelector('#open-email').addEventListener('click', () => { status.textContent = 'Seu aplicativo de e-mail deve abrir. Revise e envie por lá. Esta página não confirma o envio.'; });
    document.querySelector('#prepare-quote').disabled = false;
  }
})();
}
function render(){
 if(pageController)pageController.abort();pageController=new AbortController();
 const route=(location.hash.startsWith('#/') ? location.hash.slice(1) : '/');
 const parsed=new URL(route,'https://offline.invalid');
 const page=PAGES[parsed.pathname]||PAGES['/'];
 window.previewQuery=parsed.search;
 document.title=page.title+' · prévia local';
 document.querySelector('#app').innerHTML=page.body;
 initPage();
 window.scrollTo(0,0);
 if(parsed.hash){requestAnimationFrame(()=>document.getElementById(parsed.hash.slice(1))?.scrollIntoView());}
}
document.addEventListener('click',event=>{const a=event.target.closest('a[data-scroll]');if(a){event.preventDefault();const target=document.getElementById(a.dataset.scroll);target?.scrollIntoView();target?.setAttribute('tabindex','-1');target?.focus();}});
window.addEventListener('hashchange',render);
render();</script></body></html>
